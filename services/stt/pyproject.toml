[project]
name = "gotiny-stt"
version = "0.1.0"
description = "STT model server. Speaks the v1 wire protocol; backends are swappable."
requires-python = ">=3.12"
dependencies = [
    "gotiny-core",
    "gotiny-providers",
    "gotiny-audio",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gotiny"]

[tool.uv.sources]
gotiny-core = { workspace = true }
gotiny-providers = { workspace = true }
gotiny-audio = { workspace = true }
