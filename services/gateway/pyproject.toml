[project]
name = "gotiny-gateway"
version = "0.1.0"
description = "The front door: signaling, the live call table, capacity and drain."
requires-python = ">=3.12"
dependencies = [
    "gotiny-core",
    "gotiny-agent",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gotiny"]

[tool.uv.sources]
gotiny-core = { workspace = true }
gotiny-agent = { workspace = true }
