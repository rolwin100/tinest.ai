[project]
name = "gotiny-tts"
version = "0.1.0"
description = "TTS model server. Speaks the v1 wire protocol; backends are swappable."
requires-python = ">=3.12"
dependencies = [
    "gotiny-core",
    "gotiny-providers",
    "gotiny-audio",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Backends are extras: the server must be installable without every model's weights.
kokoro = ["kokoro-onnx>=0.4", "onnxruntime>=1.20"]
qwen = ["qwen-tts>=0.1", "torch>=2.4", "soundfile>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gotiny"]

[tool.uv.sources]
gotiny-core = { workspace = true }
gotiny-providers = { workspace = true }
gotiny-audio = { workspace = true }
