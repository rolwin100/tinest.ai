[project]
name = "gotiny-bench"
version = "0.1.0"
description = "Conformance + latency + quality benchmarks. Decides every model swap."
requires-python = ">=3.12"
dependencies = ["gotiny-core", "gotiny-providers"]

[project.optional-dependencies]
# Heavy scoring deps live here, NOT in the default set, so the agent's runtime
# image never inherits torch just because bench is a workspace member.
eval = ["jiwer>=3.0", "numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conformance"]

[tool.uv.sources]
gotiny-core = { workspace = true }
gotiny-providers = { workspace = true }
