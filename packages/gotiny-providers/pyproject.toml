[project]
name = "gotiny-providers"
version = "0.1.0"
description = "The swap seam: provider registry, wire protocol, and Pipecat bridges"
requires-python = ">=3.12"
dependencies = [
    "gotiny-core",
    "pydantic>=2.9",
    "websockets>=13.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The Pipecat bridges are optional so the conformance suite can run — and the
# wire protocol can be tested — without pulling the whole voice framework in.
pipecat = ["pipecat-ai>=1.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gotiny"]

[tool.uv.sources]
gotiny-core = { workspace = true }
